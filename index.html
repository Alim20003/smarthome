<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منزلي - Home Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">

    <!-- Header -->
    <header>
      <div class="brand-icon">🏠</div>
      <div>
        <h1>منزلي</h1>
        <p>Smart Home Control</p>
      </div>
      <span id="connection" class="status offline">● غير متصل</span>
    </header>

    <!-- شريط الوضع -->
    <div class="mode-bar">
      <button id="btnOnline" class="mode-btn active-mode">☁️ أونلاين</button>
      <button id="btnLocal"  class="mode-btn">📡 محلي</button>
      <span id="modeStatus" class="mode-status">🌐 وضع أونلاين - Firebase</span>
    </div>

    <!-- ملخص -->
    <div class="summary-bar">
      <div class="summary-item">
        <div class="summary-row">
          <span>🟢</span>
          <span class="summary-count" id="countOn">0</span>
        </div>
        <span class="summary-label">شغّال</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="summary-row">
          <span>⚫</span>
          <span class="summary-count" id="countOff">4</span>
        </div>
        <span class="summary-label">مطفي</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="summary-row">
          <span>💡</span>
          <span class="summary-count">4</span>
        </div>
        <span class="summary-label">الإجمالي</span>
      </div>
    </div>

    <!-- تشغيل/إيقاف الكل -->
    <div class="all-toggle">
      <button id="btnAllOn"  class="btn-all btn-all-on">⚡ تشغيل الكل</button>
      <button id="btnAllOff" class="btn-all btn-all-off">🔴 إيقاف الكل</button>
    </div>

    <!-- المفاتيح -->
    <section class="grid">
      <article class="card" id="card1">
        <div class="lamp off" id="lamp1">💡</div>
        <div class="info">
          <h2 id="name1">المفتاح 1</h2>
          <p id="state1">مطفي</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="switch1">
          <span class="slider"></span>
        </label>
      </article>

      <article class="card" id="card2">
        <div class="lamp off" id="lamp2">💡</div>
        <div class="info">
          <h2 id="name2">المفتاح 2</h2>
          <p id="state2">مطفي</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="switch2">
          <span class="slider"></span>
        </label>
      </article>

      <article class="card" id="card3">
        <div class="lamp off" id="lamp3">💡</div>
        <div class="info">
          <h2 id="name3">المفتاح 3</h2>
          <p id="state3">مطفي</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="switch3">
          <span class="slider"></span>
        </label>
      </article>

      <article class="card" id="card4">
        <div class="lamp off" id="lamp4">💡</div>
        <div class="info">
          <h2 id="name4">المفتاح 4</h2>
          <p id="state4">مطفي</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="switch4">
          <span class="slider"></span>
        </label>
      </article>
    </section>

    <!-- إعدادات ESP -->
    <div class="esp-settings">
      <h3>⚙️ إعدادات ESP المحلي</h3>
      <div class="esp-row">
        <input type="text" id="espIpInput"
               placeholder="192.168.1.x (IP الـ ESP)"
               class="esp-input">
        <button id="btnSaveIp"  class="btn-esp">💾 حفظ</button>
        <button id="btnTestEsp" class="btn-esp btn-esp-test">🔍 اختبار</button>
      </div>
    </div>

    <!-- آخر تحديث -->
    <div class="log">
      <h3>آخر تحديث</h3>
      <p id="lastUpdate">في انتظار الاتصال...</p>
    </div>

  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
