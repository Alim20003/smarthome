<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منزلي - Home Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="theme-toggle" onclick="toggleTheme()" title="تبديل الوضع">
    <span id="themeIcon">🌙</span>
  </div>

  <main class="container">
    <!-- Header -->
    <header>
      <div class="header-left">
        <div class="brand-icon">🏠</div>
        <div>
          <h1>منزلي</h1>
          <p>Smart Home Control</p>
        </div>
      </div>
      <span id="connection" class="status offline">● غير متصل</span>
    </header>

    <!-- شريط الوضع -->
    <div class="mode-bar">
      <button id="btnOnline" class="mode-btn active-mode">☁️ أونلاين</button>
      <button id="btnLocal"  class="mode-btn">📡 محلي</button>
      <span id="modeStatus" class="mode-status">🌐 وضع أونلاين - Firebase</span>
    </div>

    <!-- ملخص كل اللوحات -->
    <div class="summary-bar">
      <div class="summary-item">
        <div class="summary-row">
          <span>🟢</span>
          <span class="summary-count" id="totalOn">0</span>
        </div>
        <span class="summary-label">شغّال</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="summary-row">
          <span>⚫</span>
          <span class="summary-count" id="totalOff">0</span>
        </div>
        <span class="summary-label">مطفي</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="summary-row">
          <span>🔌</span>
          <span class="summary-count" id="totalBoards">0</span>
        </div>
        <span class="summary-label">لوحة</span>
      </div>
    </div>

    <!-- اللوحات -->
    <div id="boardsContainer">
      <div class="loading">
        <div class="spinner"></div>
        <p>جارٍ تحميل اللوحات...</p>
      </div>
    </div>

    <!-- إعدادات ESP -->
    <div class="esp-settings">
      <h3>⚙️ إعدادات ESP المحلي</h3>
      <div class="esp-row">
        <input type="text" id="espIpInput"
               placeholder="192.168.1.x (IP الـ ESP)"
               class="esp-input">
        <button id="btnSaveIp"  class="btn-esp">💾 حفظ</button>
        <button id="btnTestEsp" class="btn-esp btn-esp-test">🔍 اختبار</button>
      </div>
    </div>

    <!-- آخر تحديث -->
    <div class="log">
      <span class="log-icon">🕐</span>
      <p id="lastUpdate">في انتظار الاتصال...</p>
    </div>

  </main>
  <script type="module" src="app.js"></script>
  <script>
    function toggleTheme() {
      const body = document.body;
      const icon = document.getElementById('themeIcon');
      if (body.classList.contains('light')) {
        body.classList.remove('light');
        icon.textContent = '🌙';
        localStorage.setItem('theme', 'dark');
      } else {
        body.classList.add('light');
        icon.textContent = '☀️';
        localStorage.setItem('theme', 'light');
      }
    }
    // تحميل الثيم المحفوظ
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light');
      document.getElementById('themeIcon').textContent = '☀️';
    }
  </script>
</body>
</html>
